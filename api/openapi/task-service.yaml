openapi: 3.0.3
info:
  title: Task Service API
  version: 1.0.0
servers:
  - url: https://api.example.com
    description: Replace with k8s ingress URL
components:
  securitySchemes:
    OIDC:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Tag:
      type: string
    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        title:
          type: string
        note:
          type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        dueDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [todo,inprogress,done,archived]
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, workspaceId, userId, title, version]
    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
    ConflictResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            current:
              $ref: '#/components/schemas/Task'

security:
  - OIDC: []
paths:
  /v1/tasks:
    post:
      summary: Create task
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workspaceId:
                  type: string
                  format: uuid
                title:
                  type: string
                note:
                  type: string
                tags:
                  type: array
                  items:
                    $ref: '#/components/schemas/Tag'
                dueDate:
                  type: string
                  format: date-time
              required: [workspaceId,title]
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictResponse'
    get:
      summary: List tasks
      parameters:
        - name: workspaceId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [todo,inprogress,done,archived]
      responses:
        '200':
          description: list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
  /v1/tasks/{id}:
    get:
      summary: Get task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Not found
    patch:
      summary: Update task (partial)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                note:
                  type: string
                tags:
                  type: array
                  items:
                    $ref: '#/components/schemas/Tag'
                dueDate:
                  type: string
                  format: date-time
                status:
                  type: string
                  enum: [todo,inprogress,done,archived]
                version:
                  type: integer
                  format: int64
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictResponse'
        '404':
          description: Not found
  /v1/tasks/{id}/notes:
    post:
      summary: Add a note to a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                version:
                  type: integer
                  format: int64
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'  
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictResponse'