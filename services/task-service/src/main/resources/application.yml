spring:
  application:
    name: task-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
  topic:
    task-events: task.events

apicurio:
  registry-url: ${APICURIO_REGISTRY:http://localhost:8080/apis/registry/v2}

security:
  oauth2:
    resourceserver:
      jwt:
        issuer-uri: ${OIDC_ISSUER:http://localhost:8081/realms/deepfocus}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
